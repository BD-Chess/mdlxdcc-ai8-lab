name: AI8 Lab Pages
on:
  push:
    branches: [lab/bootstrap-r1]
    paths: ['public/**', 'scripts/build_pages.py', 'scripts/lab_pages_runtime.js', '.github/workflows/lab-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ai8-lab-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Prepare isolated lab website
        run: python scripts/build_pages.py --output .pages-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Publish lab
        id: deploy
        uses: actions/deploy-pages@v4
